<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido · NEXORA SOFTWARE</title><link rel="stylesheet" href="/site.css"></head><body class="subpage"><header class="header"><a class="logo" href="/"><b>N</b><span>NEXORA BARBER<small>SOFTWARE</small></span></a></header><main class="simple-card"><p class="eyebrow">TU PEDIDO</p><h1 id="title">Consulta el estado</h1><p id="body">El estado solo se muestra al verificar el WhatsApp usado al comprar.</p><form id="lookup" class="login-card"><label>Identificador<input id="order-id" required></label><label>Tu WhatsApp<input id="contact" type="tel" required></label><button class="button gold">Consultar</button><p id="result" class="status"></p></form><a class="button outline" href="/">Volver al inicio</a></main><script>const params=new URLSearchParams(location.search);document.querySelector('#order-id').value=params.get('id')||'';document.querySelector('#lookup').onsubmit=async e=>{e.preventDefault();const result=document.querySelector('#result');try{const r=await fetch('/api/order-status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:document.querySelector('#order-id').value,contact:document.querySelector('#contact').value})});const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#title').textContent=d.status;result.textContent='Pedido '+d.id;if(d.publicUrl){const a=document.createElement('a');a.href=d.publicUrl;a.textContent=' Abrir página publicada';result.append(a)}}catch(err){result.textContent=err.message}}</script></body></html>
