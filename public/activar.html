<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/site.css"><title>Activar acceso · NEXORA BARBER</title></head><body class="subpage"><header class="header"><a class="logo" href="/"><b>N</b><span>NEXORA BARBER<small>SOFTWARE</small></span></a></header><main class="simple-card"><p class="eyebrow">INVITACIÓN DEL ADMINISTRADOR</p><h1>Activa tu <em>acceso.</em></h1><form id="activate" class="login-card"><label>Correo<input name="email" type="email" autocomplete="email" required></label><label>Crea una contraseña (12 caracteres o más)<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><button class="button gold">Crear acceso</button><p id="status" class="status"></p></form></main><script>const token=new URLSearchParams(location.search).get('token');document.querySelector('#activate').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const r=await fetch('/api/barber/accept-invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,email:f.get('email'),password:f.get('password')})});const d=await r.json();if(!r.ok)throw Error(d.error);location.href='/barbero'}catch(err){document.querySelector('#status').textContent=err.message}}</script></body></html>
